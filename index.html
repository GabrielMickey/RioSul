<style>
:root{--primary:#d71920;--secondary:#ffc20e;--bg:#f5f5f2;--btn:#d71920;--ink:#1c1c1e;--mut:#6b6b73;--line:#e6e6e0;--card:#fff;--ok:#16a34a;--blue:#2563eb;--font:'Poppins',system-ui,sans-serif;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font),system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;font-size:15px}
body.noscroll{overflow:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:#fff;padding:13px 20px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,filter .15s;min-height:46px;border:2px solid transparent}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--btn);border-color:var(--btn)}
.btn.ok{background:var(--ok)}.btn.dark{background:#1c1c1e}.btn.danger{background:#dc2626}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eee;color:#444;white-space:nowrap}
.badge.ativo{background:#dcfce7;color:#166534}.badge.agendado{background:#dbeafe;color:#1e40af}.badge.rascunho{background:#e5e7eb;color:#4b5563}.badge.encerrado{background:#f1efe9;color:#8a8577}.badge.arquivado{background:#fef3c7;color:#92400e}
.badge.hot{background:var(--secondary);color:#222}.badge.late{background:#dc2626;color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.sk{position:relative;background:linear-gradient(90deg,#ebebe6 25%,#f6f6f2 50%,#ebebe6 75%);background-size:200% 100%;animation:sh 1.2s infinite;min-height:60vw}
.sk img{opacity:0}
@keyframes sh{to{background-position:-200% 0}}
#toasts{position:fixed;left:0;right:0;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 12px}
.toast{background:#1c1c1e;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px #0004;animation:up .25s;max-width:440px}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
@keyframes up{from{transform:translateY(12px);opacity:0}}
/* PUBLIC */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #0000000a}
.top-in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none}
.logo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storebtn{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 70%,#000));color:#fff;padding:28px 16px 34px;text-align:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--secondary);opacity:.22}
.hero h1{font-size:clamp(28px,7vw,48px);font-weight:800;letter-spacing:-.5px;line-height:1.1;position:relative}
.hero p{opacity:.95;margin-top:8px;position:relative}
.period{display:inline-block;margin-top:14px;background:var(--secondary);color:#222;padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;position:relative}
.wrap{max-width:1100px;margin:auto;padding:18px 14px 120px}
.sec-t{font-size:22px;font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 14px #00000012;overflow:hidden}
.fl-head{padding:16px}
.fl-head h2{font-size:20px;font-weight:800}
.fl-head p{color:var(--mut);font-size:14px;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px}
.seg button.on{background:var(--primary);color:#fff}
.pages.v{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto}
.pg{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001;cursor:zoom-in}
.pg img{width:100%;height:auto}
.carw{position:relative;max-width:640px;margin:0 auto}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .pg{flex:0 0 100%;scroll-snap-align:center}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#fffd;box-shadow:0 2px 10px #0004;font-size:22px;font-weight:700;z-index:2}
.cnav.l{left:6px}.cnav.r{right:6px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:#cfcfc8}.dots i.on{background:var(--primary);width:22px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc img{width:100%;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:#eee}
.pc .b{padding:14px}.pc h3{font-size:17px;font-weight:800}.pc p{color:var(--mut);font-size:13px;margin:4px 0 10px}
.pc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;text-decoration:none}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.banner{background:#fff7d6;border:1px solid #f3dc82;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;font-weight:600;font-size:14px}
.warn{background:#fee2e2;border-color:#fca5a5}
.store-c{padding:16px;display:flex;flex-direction:column;gap:6px}
.store-c h3{font-size:17px;font-weight:800}.store-c p{font-size:13px;color:var(--mut)}
.store-c img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:6px}
.foot{background:#1c1c1e;color:#d8d8d8;padding:30px 16px 110px;text-align:center;font-size:13px}
.foot a{color:#fff;margin:0 8px;font-weight:600}.foot .legal{max-width:640px;margin:14px auto 0;opacity:.8}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;background:#25d366;color:#fff;padding:14px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 22px #0005;text-decoration:none;display:flex;gap:8px;align-items:center}
.cta-bar{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;background:var(--btn);color:#fff;padding:14px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 22px #0005;text-decoration:none}
.sheetbg{position:fixed;inset:0;background:#000a;z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;animation:sl .25s}
.sheet.wide{max-width:860px}
@keyframes sl{from{transform:translateY(40px)}}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .x{font-size:22px;width:36px;height:36px;border-radius:50%;background:var(--bg)}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.opt.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,#fff)}
.opt b{display:block}.opt small{color:var(--mut)}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:22px}}
#lb{position:fixed;inset:0;background:#000f;z-index:300;display:flex;flex-direction:column}
.lb-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff;font-weight:600}
.lb-bar button{color:#fff;font-size:22px;width:44px;height:44px}
.lb-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.lb-stage.z{display:block}.lb-stage.z img{max-width:none;max-height:none;width:230%;cursor:zoom-out}
.lb-nav{position:absolute;top:50%;width:48px;height:64px;color:#fff;font-size:42px;background:#0006;z-index:2;transform:translateY(-50%)}
.lb-nav.l{left:0;border-radius:0 12px 12px 0}.lb-nav.r{right:0;border-radius:12px 0 0 12px}
/* ADMIN */
.adm{display:flex;min-height:100vh;background:#f1f2f6;color:#1c1c1e}
.adm aside{width:230px;background:#15171e;color:#cfd2dc;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.adm aside h2{color:#fff;font-size:16px;padding:6px 10px 16px;display:flex;gap:8px;align-items:center}
.adm aside button{display:flex;width:100%;gap:10px;padding:11px 12px;border-radius:10px;color:inherit;font-weight:600;font-size:14px;text-align:left}
.adm aside button:hover{background:#ffffff14}.adm aside button.on{background:var(--primary);color:#fff}
.adm main{flex:1;min-width:0;padding:20px 22px 80px}
.adm .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.adm h1{font-size:24px;font-weight:800;flex:1}
.modebadge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.modebadge.l{background:#fef3c7;color:#92400e}.modebadge.c{background:#dcfce7;color:#166534}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px #0001}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.pnl{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px #0001;margin-bottom:16px}
.pnl h3{font-size:16px;font-weight:800;margin-bottom:10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#444}
.f .full{grid-column:1/-1}
.f input,.f select,.f textarea,.fi{border:1px solid #d5d7df;border-radius:10px;padding:10px 12px;background:#fff;width:100%;font-weight:400;font-size:14px}
.f textarea{min-height:80px;resize:vertical}
.f input[type=checkbox]{width:auto}.f .ck{flex-direction:row;align-items:center;gap:8px}
.f input[type=color]{padding:2px;height:42px}
.rows .r{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eceef3;flex-wrap:wrap}
.rows .r:last-child{border:0}
.rows .th{width:54px;height:68px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none}
.rows .inf{flex:1;min-width:200px}.rows .inf b{display:block}.rows .inf small{color:var(--mut)}
.rows .acts{display:flex;gap:6px;flex-wrap:wrap}
.drop{display:block;border:2px dashed #b9bdc9;border-radius:14px;padding:26px;text-align:center;background:#fafbff;cursor:pointer;font-weight:600;color:#555}
.drop.over{border-color:var(--primary);background:#fff0f0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.pgi{position:relative;background:#fff;border:2px solid #e1e3ea;border-radius:10px;overflow:hidden;cursor:grab}
.pgi.cv{border-color:var(--secondary);box-shadow:0 0 0 2px var(--secondary)}
.pgi img{width:100%;aspect-ratio:3/4;object-fit:cover}
.pgi .n{position:absolute;top:4px;left:4px;background:#000a;color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:700}
.pgi .tb{display:flex;justify-content:space-between;padding:3px;font-size:12px}
.pgi .tb button{width:26px;height:26px;border-radius:6px;background:#f1f2f6}
.pgi small{display:block;text-align:center;font-size:11px;color:#666;padding-bottom:3px}.pgi small.big{color:#dc2626;font-weight:700}
pre.sql{background:#0f1117;color:#c9f;padding:14px;border-radius:12px;max-height:340px;overflow:auto;font-size:12px;white-space:pre}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid #eceef3;text-align:left}
table.t td.n,table.t th.n{text-align:right}
.phone{width:min(390px,100%);height:70vh;margin:auto;border:10px solid #111;border-radius:34px;overflow:auto;background:var(--bg)}
.login{max-width:400px;margin:10vh auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002}
.login h1{font-size:24px;margin-bottom:6px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.prog{height:10px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
@media(max-width:820px){.adm{flex-direction:column}.adm aside{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}.adm aside h2{display:none}.adm aside button{width:auto;white-space:nowrap}.adm main{padding:14px 12px 80px}}
</style>
</head>

<script>
'use strict';
/* ===== UTIL ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayNum=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const addDays=(s,n)=>{const d=new Date((dayNum(s)+n)*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const fmtD=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}`:'';
const fmtDY=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'';
const fmtB=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
const slugify=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
const debounce=(f,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|tel:|mailto:|data:image\/|blob:)/i.test(u)?u:''};
const httpUrl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u};
const digits=s=>String(s||'').replace(/\D/g,'');
const waNum=s=>{const d=digits(s);return d.length<=11?'55'+d:d};
const pick=(o,cols)=>{const r={};cols.forEach(c=>{if(o[c]!==undefined)r[c]=o[c]});return r};
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar biblioteca externa'));document.head.appendChild(s)});
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
const download=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
const baseUrl=()=>location.origin+location.pathname;
const ToastManager={show(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),t==='err'?5500:3000)}};
const toast=(m,t)=>ToastManager.show(m,t);

/* ===== CONSTANTES ===== */
const COLS={
 flyers:['id','title','slug','description','campaign','start_date','end_date','all_stores','store_ids','cover_url','pdf_url','featured','published','archived','deleted_at','notes','demo','created_by','created_by_email','created_at','updated_at','published_at'],
 stores:['id','name','address','neighborhood','city','phone','whatsapp','maps_url','hours','image_url','active','demo','created_at'],
 promotions:['id','title','description','image_url','start_date','end_date','all_stores','store_ids','cta_label','link_url','featured','position','published','archived','demo','created_at','updated_at']
};
const DEF={name:'Supermercado Exemplo',slogan:'Qualidade e preço baixo toda semana',logo:'',favicon:'',primary:'#d71920',secondary:'#ffc20e',bg:'#f5f5f2',btn:'#d71920',font:'Poppins',hero:'OFERTAS DA SEMANA 🔥',heroSub:'Confira nossas promoções e aproveite antes que acabem.',whatsapp:'',waMessage:'Olá! Vi as ofertas pelo encarte online e gostaria de mais informações.',site:'',instagram:'',facebook:'',tiktok:'',footer:'',policy:'',legal:'Ofertas válidas durante o período informado ou enquanto durarem os estoques. Consulte condições na loja.',historyPublic:true};
const FONTS=['Poppins','Inter','Montserrat','Nunito','Roboto','Open Sans'];
const CDN_SB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
const CDN_QR='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';

/* ===== STATE ===== */
const S={settings:{...DEF},stores:[],flyers:[],promos:[],events:[],cloud:false,cloudErr:'',user:null,isAdmin:null,storeId:localStorage.getItem('store_id')||'',tab:'dashboard',loadErr:''};
const isAdminRoute=()=>/^#admin/.test(location.hash);

/* ===== LOCAL DB (IndexedDB) ===== */
const LocalDB={db:null,mem:{},bad:false,
 open(){if(this.db||this.bad)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('encartes_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>{this.bad=true;res(null)}}catch{this.bad=true;res(null)}})},
 async get(k,d){const db=await this.open();if(!db)return this.mem[k]??d;return new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result===undefined?d:q.result);q.onerror=()=>res(d)})},
 async set(k,v){const db=await this.open();if(!db){this.mem[k]=v;return}return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};

/* ===== STATUS / DATAS ===== */
const flyerStatus=f=>{if(!f)return'';if(f.archived||f.deleted_at)return'arquivado';if(!f.published)return'rascunho';const t=todayStr(),s=f.start_date||'0000-01-01',e=f.end_date||'9999-12-31';return t<s?'agendado':t>e?'encerrado':'ativo'};
const daysLeft=f=>f.end_date?dayNum(f.end_date)-dayNum(todayStr()):999;
const timeLabel=f=>{const st=flyerStatus(f),t=dayNum(todayStr());
 if(st==='agendado'){const n=dayNum(f.start_date)-t;return n===1?'Começa amanhã':`Começa em ${n} dias`}
 if(st==='ativo'){if(!f.end_date)return'';const n=daysLeft(f);return n===0?'Termina hoje':n===1?'Termina amanhã':`Termina em ${n} dias`}
 if(st==='encerrado'){const n=t-dayNum(f.end_date);return n===1?'Encerrado há 1 dia':`Encerrado há ${n} dias`}
 return''};
const statusLabel={ativo:'Ativo',agendado:'Agendado',rascunho:'Rascunho',encerrado:'Encerrado',arquivado:'Arquivado'};
const badge=f=>{const s=flyerStatus(f);return `<span class="badge ${s}">${statusLabel[s]}</span>`};
const lastDaysBadge=f=>{if(flyerStatus(f)!=='ativo'||!f.end_date)return'';const n=daysLeft(f);return n===0?'<span class="badge late">TERMINA HOJE</span>':n===1?'<span class="badge late">TERMINA AMANHÃ</span>':n<=2?'<span class="badge hot">ÚLTIMOS DIAS</span>':''};
const period=f=>f.start_date&&f.end_date?`Ofertas válidas de ${fmtD(f.start_date)} a ${fmtD(f.end_date)}`:f.end_date?`Ofertas válidas até ${fmtD(f.end_date)}`:'';

 track(event,x={}){if(isAdminRoute())return;const row={event,flyer_id:x.flyer||null,promo_id:x.promo||null,store_id:S.storeId||null,utm:this.utm(),session:this.sid,created_at:new Date().toISOString()};

const UploadManager={
 types:['image/jpeg','image/png','image/webp'],
 async optimize(file,max=1600,q=.86){
  if(!this.types.includes(file.type))throw new Error(`"${file.name}": formato inválido (use JPG, PNG ou WebP).`);
  if(file.size>25*1048576)throw new Error(`"${file.name}": imagem muito grande (máx. 25 MB).`);
  try{const bmp=await createImageBitmap(file);const r=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*r);cv.height=Math.round(bmp.height*r);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
   const blob=await new Promise(res=>cv.toBlob(res,'image/webp',q));if(blob&&blob.type==='image/webp'&&(blob.size<file.size||r<1))return blob}catch{}
  return file},
 pdf(file){if(file.type!=='application/pdf')throw new Error('Arquivo inválido: selecione um PDF.');if(file.size>40*1048576)throw new Error('PDF muito grande (máx. 40 MB).');return file}
};

 filtered(){const q=this.flt,t=todayStr();return S.flyers.filter(f=>{const st=flyerStatus(f);if(q.status?st!==q.status:st==='arquivado'&&false)return false;if(q.status&&st!==q.status)return false;if(q.store&&!(f.all_stores||f.store_ids.includes(q.store)))return false;if(q.from&&f.end_date<q.from)return false;if(q.to&&f.start_date>q.to)return false;

 /* analytics */
 v_analytics(){const m={};const key=id=>{const f=S.flyers.find(x=>x.id===id);return f?(f.campaign||f.title):'(página principal)'};S.events.forEach(e=>{const k=key(e.flyer_id);m[k]=m[k]||{v:0,w:0,s:0,d:0,mp:0};if(e.event==='flyer_view'||e.event==='page_view'&&!e.flyer_id)m[k].v++;if(e.event==='whatsapp_click')m[k].w++;if(e.event==='share')m[k].s++;if(e.event==='pdf_download')m[k].d++;if(e.event==='maps_click')m[k].mp++});
  const src={};S.events.filter(e=>e.event==='page_view').forEach(e=>{const k=(e.utm?.utm_source||'direto')+(e.utm?.utm_medium?' / '+e.utm.utm_medium:'');src[k]=(src[k]||0)+1});
  const stc={};S.events.filter(e=>e.event==='store_select').forEach(e=>{const k=S.stores.find(s=>s.id===e.store_id)?.name||'—';stc[k]=(stc[k]||0)+1});
  return `<div class="bar"><h1>Analytics</h1></div><div class="pnl"><h3>Por campanha</h3><div style="overflow:auto"><table class="t"><tr><th>Campanha</th><th class="n">Visualizações</th><th class="n">WhatsApp</th><th class="n">Compartilhamentos</th><th class="n">Downloads</th><th class="n">Maps</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.v}</td><td class="n">${v.w}</td><td class="n">${v.s}</td><td class="n">${v.d}</td><td class="n">${v.mp}</td></tr>`).join('')||'<tr><td colspan="6" style="color:#777">Sem dados ainda.</td></tr>'}</table></div></div><div class="pnl"><h3>Origem dos acessos (UTM)</h3><table class="t">${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')||'<tr><td style="color:#777">Sem dados.</td></tr>'}</table></div><div class="pnl"><h3>Seleção de unidade</h3><table class="t">${Object.entries(stc).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')||'<tr><td style="color:#777">Sem dados.</td></tr>'}</table></div>`},
 /* cloud */
 v_cloud(){const c=SB.cfg()||{};return `<div class="bar"><h1>Configuração da nuvem</h1></div><form class="pnl f" data-form="cloud"><label class="full">Supabase URL<input name="url" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co"></label><label class="full">Supabase Anon Key<input name="key" value="${esc(c.key||'')}" placeholder="eyJ..."></label><div class="full row"><button class="btn">Salvar configuração</button><button type="button" class="btn sec" data-act="cloudtest">Testar conexão</button><button type="button" class="btn danger" data-act="cloudrm">Remover configuração</button></div></form>${S.cloudErr?`<div class="banner warn">${esc(S.cloudErr)}</div>`:''}<div class="pnl"><h3>Configuração inicial do banco</h3><ol style="margin:0 0 12px 18px;font-size:14px;color:#444"><li>Crie um projeto no Supabase.</li><li>Copie o SQL abaixo e execute em <b>SQL Editor</b> (uma única vez).</li><li>Em <b>Authentication → Users</b>, crie os usuários da agência e desative novos cadastros públicos.</li><li>Cole URL e Anon Key acima e salve.</li></ol><button class="btn" data-act="copysql" style="margin-bottom:10px">COPIAR SQL</button><pre class="sql">${esc(SQL)}</pre></div>`},
 v_backup(){return `<div class="bar"><h1>Backup e dados</h1></div><div class="pnl"><div class="row"><button class="btn" data-act="bkexp">EXPORTAR BACKUP</button><label class="btn sec" style="cursor:pointer">IMPORTAR BACKUP<input type="file" id="bkimp" accept="application/json" hidden></label><button class="btn danger" data-act="rmdemo">REMOVER DADOS DE DEMONSTRAÇÃO</button><button class="btn sec" data-act="onbopen">Rever primeiro acesso</button></div><p style="margin-top:12px;font-size:13px;color:#555">O backup inclui configurações, lojas, encartes (com páginas) e promoções em JSON. No modo local, imagens ficam incorporadas ao arquivo.</p></div>`}
};

/* ===== BACKUP ===== */
const BackupManager={export(){download(`backup-encartes-${todayStr()}.json`,new Blob([JSON.stringify({v:1,at:new Date().toISOString(),settings:S.settings,stores:S.stores,flyers:S.flyers,promotions:S.promos})],{type:'application/json'}))},
 async import(file){let d;try{d=JSON.parse(await file.text());if(!d||typeof d!=='object'||!Array.isArray(d.flyers))throw 0}catch{toast('Arquivo de backup inválido.','err');return}
  if(!confirm('Importar este backup? Registros com o mesmo ID serão substituídos.'))return;
  try{if(d.settings)await Data.saveSettings(d.settings);for(const s of d.stores||[])await Data.save('stores',s);for(const f of d.flyers||[])await Data.save('flyers',{...f,pages:f.pages||[]});for(const p of d.promotions||[])await Data.save('promotions',p);toast('Backup importado!','ok');Admin.render()}catch(e){Admin.err(e,'Falha ao importar')}}};

/* ===== APP / ROUTER ===== */
const App={
 async load(){try{await Data.loadAll();S.loadErr='';if(isAdminRoute())await Data.loadEvents()}catch(e){console.error(e);const c=(()=>{try{return JSON.parse(localStorage.getItem('cache_pub')||'null')}catch{return null}})();
   if(c){S.settings={...DEF,...c.s};S.stores=c.st;S.flyers=c.fl;S.promos=c.pr;S.loadErr='Estamos com instabilidade na conexão. Exibindo as últimas ofertas salvas.'}else S.loadErr='Não foi possível carregar as ofertas agora. Tente novamente em instantes.'}},
 render(){if(isAdminRoute()){const t=location.hash.split('/')[1];if(t&&(TABS.some(x=>x[0]===t)||t==='flyer-edit'))S.tab=t;if(S.tab==='flyer-edit'&&!Ed.f)S.tab='flyers';Admin.render()}else Pub.render()},
 async boot(){
  try{S.cloud=await SB.init()}catch(e){S.cloud=false;S.cloudErr='Não foi possível carregar o Supabase: '+e.message}
  if(S.cloud)await AuthManager.start().catch(()=>{});
  if(!S.cloud&&!localStorage.getItem('seeded')&&(await LocalDB.get('flyers',[])).length===0&&!SB.cfg())await seedDemo();
  await this.load();
  const lj=new URLSearchParams(location.search).get('loja');if(lj&&S.stores.some(s=>s.id===lj)){S.storeId=lj;localStorage.setItem('store_id',lj)}
  if(S.storeId&&!S.stores.some(s=>s.id===S.storeId))S.storeId='';
  AnalyticsManager.utm();this.render();
  addEventListener('hashchange',()=>{if(isAdminRoute()&&S.cloud&&S.user)Data.loadEvents().then(()=>this.render());else this.render()});
  addEventListener('popstate',()=>this.render());
 }
};

/* ===== ACTIONS ===== */
const A={
 nav(el,e){e.preventDefault();history.pushState(null,'',el.getAttribute('href'));Pub.render();scrollTo({top:0})},
 view(el){Pub.view=el.dataset.v;Pub.refreshFlyer()},
 lb(el){const f=Pub.mainFlyer;if(f)LB.open(f.pages.map(p=>p.url),+el.dataset.i)},
 lbp(el){const p=S.promos.find(x=>x.id===el.dataset.id);if(p)LB.open([p.image_url],0)},
 lbclose(){LB.close()},lbzoom(){LB.z=!LB.z;LB.draw()},lbprev(){LB.go(-1)},lbnext(){LB.go(1)},
 carprev(){$('#car').scrollBy({left:-$('#car').clientWidth,behavior:'smooth'})},carnext(){$('#car').scrollBy({left:$('#car').clientWidth,behavior:'smooth'})},
 share(el){ShareManager.open(S.flyers.find(f=>f.id===el.dataset.id)||Pub.mainFlyer)},
 shwa(){ShareManager.wa()},shnat(){ShareManager.native()},shcopy(){const{u,f}=window._sh;AnalyticsManager.track('share',{flyer:f?.id});ShareManager.copy(u);Modal.close()},
 pdfdl(el){AnalyticsManager.track('pdf_download',{flyer:el.dataset.id})},
 wa(){AnalyticsManager.track('whatsapp_click',{flyer:Pub.mainFlyer?.id})},
 maps(el){AnalyticsManager.track('maps_click')},
 promoclick(el){AnalyticsManager.track('promo_click',{promo:el.dataset.id})},
 stores(){Pub.stores()},pickstore(el){Pub.pick(el.dataset.id)},
 mclose(){Modal.close()},mbg(el,e){if(e.target===el)Modal.close()},
 copy(el){ShareManager.copy(el.dataset.v)},copysql(){ShareManager.copy(SQL)},
 /* admin */
 tab(el){Admin.go(el.dataset.t)},site(){location.href=baseUrl()},logout(){if(S.cloud)AuthManager.logout();else location.href=baseUrl()},
 async reset(el,e){e.preventDefault();const m=prompt('Informe seu e-mail para recuperar a senha:');if(!m)return;try{await AuthManager.reset(m);toast('Link de recuperação enviado.','ok')}catch(x){Admin.err(x)}},
 onbgo(el){localStorage.setItem('onb_done','1');Modal.close();if(el.dataset.t==='flyer-edit')A.newflyer();else Admin.go(el.dataset.t)},onbskip(){localStorage.setItem('onb_done','1');Modal.close()},onbopen(){Admin.onboarding()},
 newflyer(){Ed.init(Ed.blank(),true);S.tab='flyer-edit';Admin.go('flyer-edit')},
 editflyer(el){const f=S.flyers.find(x=>x.id===el.dataset.id);Ed.init(JSON.parse(JSON.stringify(f)),false);Admin.go('flyer-edit')},
 dupflyer(el){const f=JSON.parse(JSON.stringify(S.flyers.find(x=>x.id===el.dataset.id)));Object.assign(f,{id:uid(),title:f.title+' (cópia)',slug:'',published:false,archived:false,deleted_at:null,published_at:null,created_at:null});Ed.init(f,true);Admin.go('flyer-edit')},
 dupweek(el){const f=JSON.parse(JSON.stringify(S.flyers.find(x=>x.id===el.dataset.id)));const len=dayNum(f.end_date)-dayNum(f.start_date);const ns=addDays(f.end_date,1);Object.assign(f,{id:uid(),slug:'',start_date:ns,end_date:addDays(ns,len),pages:[],cover_url:'',pdf_url:'',published:false,archived:false,deleted_at:null,published_at:null,created_at:null,demo:false});Ed.init(f,true);Admin.go('flyer-edit');toast('Datas ajustadas para a próxima semana. Envie as novas artes.','ok')},
 viewflyer(el){const f=S.flyers.find(x=>x.id===el.dataset.id);Pub.view='vertical';Modal.open(`<div class="phone">${Pub.flyerHTML({...f,published:true}).replace(/data-act="(share|view|lb|pdfdl|carprev|carnext)"/g,'data-x="$1"')}</div>`,{title:'Visualizar como cliente',wide:true})},
 async togpub(el){const f={...S.flyers.find(x=>x.id===el.dataset.id)};f.published=!f.published;if(f.published&&!f.published_at)f.published_at=new Date().toISOString();try{await Data.save('flyers',f);toast(f.published?'Publicado.':'Despublicado.','ok');Admin.render()}catch(e){Admin.err(e)}},
 qrflyer(el){const f=S.flyers.find(x=>x.id===el.dataset.id);Admin.showQR(`${ShareManager.url(f)}&utm_source=offline&utm_medium=qrcode`,'qr-'+f.slug)},
 qrstore(el){Admin.showQR(`${baseUrl()}?loja=${el.dataset.id}&utm_source=offline&utm_medium=qrcode`,'qr-loja')},
 async archflyer(el){const f={...S.flyers.find(x=>x.id===el.dataset.id)};f.archived=!f.archived;try{await Data.save('flyers',f);toast(f.archived?'Encarte arquivado.':'Encarte restaurado.','ok');Admin.render()}catch(e){Admin.err(e)}},
 async delflyer(el){const f=S.flyers.find(x=>x.id===el.dataset.id);if(!confirm(`Excluir DEFINITIVAMENTE "${f.title}"? Esta ação não pode ser desfeita. (Prefira Arquivar para manter o histórico.)`))return;try{await Data.remove('flyers',f.id);toast('Encarte excluído.','ok');Admin.render()}catch(e){Admin.err(e)}},
 edmv(el){Ed.move(+el.dataset.i,+el.dataset.d)},edcv(el){Ed.cover=Ed.pages[+el.dataset.i].id;Ed.drawPages()},eddel(el){const[p]=Ed.pages.splice(+el.dataset.i,1);if(p.id===Ed.cover)Ed.cover=Ed.pages[0]?.id||null;Ed.drawPages()},
 pdfrm(){Ed.pdf=null;Admin.render()},
 edpreview(){Ed.preview()},edsave(el){Ed.save(el.dataset.p==='1')},
 editpromo(el){const p=S.promos.find(x=>x.id===el.dataset.id)||{id:uid(),title:'',description:'',image_url:'',start_date:todayStr(),end_date:addDays(todayStr(),6),all_stores:true,store_ids:[],cta_label:'',link_url:'',featured:false,position:0,published:true,archived:false};Modal.open(Admin.promoForm(p),{title:'Promoção',wide:true})},
 async duppromo(el){const p={...S.promos.find(x=>x.id===el.dataset.id),id:uid(),title:S.promos.find(x=>x.id===el.dataset.id).title+' (cópia)',published:false,created_at:new Date().toISOString()};try{await Data.save('promotions',p);toast('Promoção duplicada.','ok');Admin.render()}catch(e){Admin.err(e)}},
 async featpromo(el){const p={...S.promos.find(x=>x.id===el.dataset.id)};p.featured=!p.featured;try{await Data.save('promotions',p);Admin.render()}catch(e){Admin.err(e)}},
 async endpromo(el){const p={...S.promos.find(x=>x.id===el.dataset.id)};p.end_date=addDays(todayStr(),-1);if(p.start_date&&p.start_date>p.end_date)p.start_date=p.end_date;try{await Data.save('promotions',p);toast('Promoção encerrada.','ok');Admin.render()}catch(e){Admin.err(e)}},
 async delpromo(el){if(!confirm('Excluir esta promoção definitivamente?'))return;try{await Data.remove('promotions',el.dataset.id);Admin.render()}catch(e){Admin.err(e)}},
 editstore(el){const s=S.stores.find(x=>x.id===el.dataset.id)||{id:uid(),name:'',address:'',neighborhood:'',city:'',phone:'',whatsapp:'',maps_url:'',hours:'',image_url:'',active:true};Modal.open(Admin.storeForm(s),{title:'Loja',wide:true})},
 async delstore(el){if(!confirm('Excluir esta loja?'))return;try{await Data.remove('stores',el.dataset.id);Admin.render()}catch(e){Admin.err(e)}},
 async cloudtest(){const f=$('[data-form=cloud]'),u=f.url.value.trim(),k=f.key.value.trim();if(!u||!k)return toast('Preencha URL e Anon Key.','err');try{await SB.test(u,k);toast('Conexão OK! Tabelas encontradas.','ok')}catch(e){toast('Falha: '+(e.message||e)+(/relation|does not exist|schema cache/i.test(e.message||'')?' — execute o SQL de configuração.':''),'err')}},
 cloudrm(){if(!confirm('Remover configuração da nuvem? O sistema voltará ao Modo Local.'))return;localStorage.removeItem('sb_cfg');location.reload()},
 bkexp(){BackupManager.export()},
 async rmdemo(){if(!confirm('Remover todos os dados de demonstração?'))return;try{for(const k of['flyers','stores','promotions'])for(const x of[...Data.arr(k)].filter(x=>x.demo))await Data.remove(k,x.id);toast('Dados de demonstração removidos.','ok');Admin.render()}catch(e){Admin.err(e)}},
 async qrdl(){const cv=$('#qrcv');cv.toBlob(b=>download('qrcode-ofertas.png',b))},
 qrmdl(){$('#qrm').toBlob(b=>download((window._qr.name||'qrcode')+'.png',b))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.dataset.act!=='nav'&&el.dataset.act!=='reset'){f(el,e);return}f(el,e)});

/* ===== FORMS ===== */
const Forms={
 noop(){},
 async login(f){try{await AuthManager.login(f.email.value.trim(),f.pw.value);Admin.render()}catch(e){toast(/Invalid login/i.test(e.message)?'E-mail ou senha incorretos.':(e.message||'Falha no login'),'err')}},
 async promo(f){const fd=new FormData(f),g=k=>(fd.get(k)||'').toString().trim();const old=S.promos.find(x=>x.id===g('id'))||{};const p={...old,id:g('id'),title:g('title'),description:g('description'),image_url:g('image_url'),start_date:g('start_date')||null,end_date:g('end_date')||null,cta_label:g('cta_label'),link_url:g('link_url'),position:+g('position')||0,featured:fd.get('featured')==='on',published:fd.get('published')==='on',all_stores:fd.get('all_stores')==='on',store_ids:fd.getAll('store_ids'),archived:false,created_at:old.created_at||new Date().toISOString()};
  if(!p.title)return toast('Informe o título.','err');if(p.start_date&&p.end_date&&p.end_date<p.start_date)return toast('A data final não pode ser anterior à inicial.','err');
  try{await Data.save('promotions',p);Modal.close();toast('Promoção salva.','ok');Admin.render()}catch(e){Admin.err(e,'Falha ao salvar')}},
 async store(f){const fd=new FormData(f),g=k=>(fd.get(k)||'').toString().trim();const old=S.stores.find(x=>x.id===g('id'))||{};const s={...old,id:g('id'),name:g('name'),address:g('address'),neighborhood:g('neighborhood'),city:g('city'),phone:g('phone'),whatsapp:g('whatsapp'),maps_url:g('maps_url'),hours:g('hours'),image_url:g('image_url'),active:fd.get('active')==='on',created_at:old.created_at||new Date().toISOString()};if(!s.name)return toast('Informe o nome da loja.','err');
  try{await Data.save('stores',s);Modal.close();toast('Loja salva.','ok');Admin.render()}catch(e){Admin.err(e,'Falha ao salvar')}},
 async settings(f){const fd=new FormData(f),n={...S.settings};for(const[k,v]of fd.entries())n[k]=v.toString().trim();if($('[name=historyPublic]',f))n.historyPublic=fd.get('historyPublic')==='on';if($('[name=name]',f)&&!n.name)return toast('Informe o nome.','err');
  try{await Data.saveSettings(n);applyBrand();toast('Configurações salvas.','ok');Admin.render()}catch(e){Admin.err(e,'Falha ao salvar')}},
 async cloud(f){const u=f.url.value.trim().replace(/\/+$/,''),k=f.key.value.trim();if(!/^https:\/\/.+/.test(u)||k.length<20)return toast('URL ou chave inválida.','err');localStorage.setItem('sb_cfg',JSON.stringify({url:u,key:k}));toast('Configuração salva. Recarregando…','ok');setTimeout(()=>location.reload(),700)}
};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();Forms[f.dataset.form]?.(f)});

/* ===== CHANGE / INPUT / DRAG ===== */
const refreshList=debounce(()=>{const l=$('#flyerList');if(l)l.innerHTML=Admin.flyerRows(Admin.filtered())||'<p style="color:#777;padding:10px">Nenhum encarte encontrado.</p>'},200);
document.addEventListener('input',e=>{const k=e.target.dataset?.flt;if(k){Admin.flt[k]=e.target.value;refreshList()}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset||{};
 if(d.flt){Admin.flt[d.flt]=t.value;refreshList()}
 if(d.link){Admin.linkSel[d.link]=t.value;if(d.link==='t')Admin.linkSel.id='';Admin.render()}
 if(d.change==='allst'){$('#stBox').style.display=t.checked?'none':'flex'}
 if(d.change==='upimg'&&t.files[0]){try{const blob=await UploadManager.optimize(t.files[0],+d.max||1000,.9);const ext=blob.type==='image/webp'?'webp':blob.type==='image/png'?'png':'jpg';const url=await Data.upload(d.bucket,blob,`${d.field}-${uid().slice(0,8)}.${ext}`);const h=$(`[name=${d.field}]`);h.value=url;const pv=$('#pv_'+d.field);pv.src=url;pv.style.display='block';toast('Imagem pronta.','ok')}catch(x){Admin.err(x,'Falha no upload')}}
 if(t.id==='pgInput'){await Ed.addFiles(t.files);t.value=''}
 if(t.id==='pdfInput'&&t.files[0]){try{const f=UploadManager.pdf(t.files[0]);Ed.pdf={url:URL.createObjectURL(f),blob:f};$('#pdfName').textContent=`${f.name} (${fmtB(f.size)})`}catch(x){toast(x.message,'err');t.value=''}}
 if(t.id==='bkimp'&&t.files[0]){await BackupManager.import(t.files[0]);t.value=''}
});
document.addEventListener('dragstart',e=>{const p=e.target.closest?.('.pgi');if(p){Ed.drag=+p.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','p')}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.pgi')||e.target.closest?.('#drop'))e.preventDefault();const d=e.target.closest?.('#drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files.length)Ed.addFiles(e.dataTransfer.files);return}
 const p=e.target.closest?.('.pgi');if(p&&Ed.drag!==null){e.preventDefault();const to=+p.dataset.i,[x]=Ed.pages.splice(Ed.drag,1);Ed.pages.splice(to,0,x);Ed.drag=null;Ed.drawPages()}});
document.addEventListener('scroll',e=>{if(e.target.id==='car'){const c=e.target,i=Math.round(c.scrollLeft/(c.clientWidth+10));$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i))}},true);

App.boot();
</script>
